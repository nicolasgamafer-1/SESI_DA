<script>
  document.addEventListener('keydown', function(event) {
    // Verifica se Ctrl, Shift, Alt e a tecla 'G' (ou 'g') foram pressionados juntos
    if (event.ctrlKey && event.shiftKey && event.altKey && (event.key === 'g' || event.key === 'G')) {
      event.preventDefault(); // Evita algum comportamento padrão do navegador
      
      // Mude 'outra-pagina.html' para o link ou arquivo que você quer abrir
      window.location.href = 'outra-pagina.html'; 
    }
  });
</script>
